plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'jacoco'
    id 'io.quarkus' version "${quarkusPluginVersion}"
    // TODO (VPN): reactivar calidad / CI compartido
    // id 'checkstyle'
    // id 'maven-publish'
    // id "com.societegenerale.commons.arch-unit-gradle-plugin" version "4.0.0"
    // id 'org.sonarqube' version '6.0.1.5171'
    // id 'org.barfuin.gradle.jacocolog' version '3.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

ext {
    packagePath = mavenGroup
    junitJupiter = '5.11.4'
    // Umbrales bajos en scaffold; subirlos conforme crezca la cobertura.
    jacocoClassMinCoverage = 0
    jacocoMethodMinCoverage = 0
    jacocoBranchMinCoverage = 0
    jacocoLineMinCoverage = 0
    jacocoInstructionMinCoverage = 0
    jacocoComplexityMinCoverage = 0
    coverageExclusions = [
        "${basePackage.replace('.', '/')}/SuperAppApartadosApplication.class"
    ]
}

group = packagePath
description = appDescription

// TODO (VPN): configuración compartida de CI (checkstyle, jacoco gates, arch-unit, etc.)
// apply from: "https://gitlab.com/machtia/ci/config/-/raw/main/ci-config.gradle"

configurations {
    configureEach {
        exclude module : 'junit-vintage-engine'
        exclude module : 'quarkus-rest-jsonb'
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.testcontainers:testcontainers:2.0.3'
    }
}

test {
    minHeapSize = "512m"
    maxHeapSize = "2g"
    jacoco {
        destinationFile = layout.buildDirectory.file("jacoco-quarkus.exec").get().asFile
    }
}

