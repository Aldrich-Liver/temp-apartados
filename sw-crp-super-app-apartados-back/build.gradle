dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")

    // TODO (VPN / Artifact Registry): librerías internas Liverpool
    // implementation 'com.liverpool.superapp:core-utils:1.10.0'
    // implementation 'com.liverpool.superapp:security-utils:1.3.0'

    // REST y JSON
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkiverse.resteasy-problem:quarkus-resteasy-problem:3.21.1'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-rest-client-jackson'
    implementation 'io.quarkus:quarkus-smallrye-context-propagation'

    // OpenAPI/Swagger
    implementation 'io.quarkus:quarkus-smallrye-openapi'

    // Validación
    implementation 'io.quarkus:quarkus-hibernate-validator'

    // Seguridad y JWT (extensiones Quarkus; sin security-utils de Liverpool por ahora)
    implementation 'io.quarkus:quarkus-security'
    implementation 'io.quarkus:quarkus-smallrye-jwt'

    // MongoDB
    implementation("io.quarkus:quarkus-mongodb-panache")
    implementation("io.quarkiverse.mongock:quarkus-mongock:0.6.0")

    // Testing
    // TODO (VPN / Artifact Registry)
    // testImplementation 'com.liverpool.superapp:security-test-utils:1.1.0'
    testImplementation 'io.quarkus:quarkus-test-security'
    testImplementation('io.quarkus:quarkus-junit5')
    testImplementation('io.quarkus:quarkus-junit5-mockito')
    testImplementation("io.quarkus:quarkus-jacoco")
    testImplementation("io.quarkus:quarkus-test-oidc-server")
    testImplementation('io.rest-assured:rest-assured')
    testImplementation('org.junit.jupiter:junit-jupiter-api')
    testImplementation('org.junit.jupiter:junit-jupiter-engine')
    testImplementation('org.testcontainers:testcontainers')
    testImplementation('org.testcontainers:mongodb')
    testImplementation('io.quarkiverse.wiremock:quarkus-wiremock-test:1.4.1')
    testImplementation("org.skyscreamer:jsonassert:1.5.3")
    testImplementation 'net.javacrumbs.json-unit:json-unit-assertj:3.2.7'
}
