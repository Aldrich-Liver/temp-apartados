# REST config
quarkus.http.root-path=/api/apartados

# Logging
quarkus.log.console.level=ALL
quarkus.log.category."org.hibernate".level=INFO
quarkus.log.category."io.quarkus".level=INFO

# ---------------------------------------------------------------------------
# Seguridad Liverpool (security-utils) — deshabilitada sin VPN / Artifact Registry
# ---------------------------------------------------------------------------
# super-app.api-keys=${SUPER_APP_API_KEYS:}

# JWT: sin llave remota de Super App. Deshabilitado para compilar/arrancar en local.
# Al reactivar Liverpool, descomentar el bloque de verificación y quitar enabled=false.
quarkus.smallrye-jwt.enabled=false
# mp.jwt.verify.publickey.location=${SUPER_APP_JWT_PUBLIC_KEY_LOCATION}
# mp.jwt.verify.issuer=super-app
# mp.jwt.verify.audiences=apartados
# smallrye.jwt.verify.key.location=${SUPER_APP_JWT_PUBLIC_KEY_LOCATION}

# OpenAPI/Swagger Configuration
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.enable=${SUPER_APP_SWAGGER_ENABLED:true}
quarkus.smallrye-openapi.info-title=Super App Apartados API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Super App Apartados
quarkus.smallrye-openapi.info-contact-name=Liverpool IT Team
quarkus.smallrye-openapi.info-contact-email=gcp-dev-superapp@liverpool.com.mx
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0
quarkus.smallrye-openapi.enable=${SUPER_APP_SWAGGER_ENABLED:true}

# TODO (VPN): indexar librerías internas en Jandex
# quarkus.index-dependency.super-app-core-utils.group-id=com.liverpool.superapp
# quarkus.index-dependency.super-app-core-utils.artifact-id=core-utils
# quarkus.index-dependency.filtro-seguridad.group-id=com.liverpool.superapp
# quarkus.index-dependency.filtro-seguridad.artifact-id=security-utils

# MongoDB — defaults locales (no requiere VPN)
quarkus.mongodb.connection-string=${SUPER_APP_APARTADOS_MONGODB_CONNECTION_STRING:mongodb://localhost:27017/?retryWrites=false}
quarkus.mongodb.database=${SUPER_APP_APARTADOS_MONGODB_DB_NAME:apartados}
# Sin change units aún: evita fallar el arranque si Mongo no está arriba en compile/dev ligero
quarkus.mongock.migrate-at-start=false
quarkus.mongodb.min-pool-size=${MONGODB_MIN_POOL_SIZE:1}
quarkus.mongodb.max-pool-size=${MONGODB_MAX_POOL_SIZE:10}

# Compilación / DevServices: no exigir Mongo real solo para compilar
quarkus.mongodb.devservices.enabled=false
